openapi: 3.0.3
info:
  title: Tesseract API
  version: 0.1.0
  description: Password sessions and protected catalog availability. Unsafe methods require an Origin header matching the configured browser origin. Reserved operations fail closed.
security:
- sessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Current service state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Current service state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        default:
          $ref: '#/components/responses/Error'
        '503':
          description: Database unavailable or server draining
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: New session; previous browser session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Session revoked
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 1024
      responses:
        '204':
          description: Password changed and all sessions revoked; sign in again
        default:
          $ref: '#/components/responses/Error'
  /api/v1/catalog:
    get:
      operationId: getCatalog
      description: Catalog metadata availability for signed-in users.
      responses:
        '200':
          description: Availability for the published catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogAvailability'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/dashboards:
    get:
      operationId: listDashboards
      description: Reserved incremental contract. Returns 501 until its implementation
        milestone; protected routes return 401 when the session cookie is absent.
        A valid session is required; no application data is read or written by this reserved handler. Request and success schemas
        will be introduced with that milestone.
      responses:
        '501':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/queries:
    post:
      operationId: executeQuery
      description: Typed direct-DWH aggregate query contract. HTTP execution remains unimplemented pending data entitlements; local operators can use cmd/query with explicit grants.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySpec'
      responses:
        '200':
          description: Bounded aggregate rows; integer and decimal values are exact strings and SQL NULL is JSON null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/dashboards/{dashboardId}/shares:
    get:
      operationId: listDashboardShares
      description: Reserved incremental contract. Returns 501 until its implementation
        milestone; protected routes return 401 when the session cookie is absent.
        A valid session is required; no application data is read or written by this reserved handler. Request and success schemas
        will be introduced with that milestone.
      responses:
        '501':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      parameters:
      - name: dashboardId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/chat:
    post:
      operationId: sendChatMessage
      description: Reserved incremental contract. Returns 501 until its implementation
        milestone; protected routes return 401 when the session cookie is absent.
        A valid session is required; no application data is read or written by this reserved handler. Request and success schemas
        will be introduced with that milestone.
      responses:
        '501':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tesseract_session
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [user_id, email, expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        expires_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
    QuerySpec:
      type: object
      additionalProperties: false
      required: [dataset, metrics, limit]
      properties:
        dataset:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
        metrics:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
        dimensions:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/QueryDimension'
        filters:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/QueryFilter'
        date_range:
          $ref: '#/components/schemas/QueryDateRange'
        order:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/QueryOrder'
        limit:
          type: integer
          minimum: 1
          maximum: 1000
    QueryDimension:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
        grain:
          type: string
          enum: [day, week, month, quarter, year]
    QueryValue:
      type: object
      additionalProperties: false
      required: [type, value]
      description: Exact typed scalar. Integer is int64; decimal has at most 20 integral and 18 fractional digits; datetime is RFC3339 normalized to UTC; date is YYYY-MM-DD. NULL uses explicit null operators.
      properties:
        type:
          type: string
          enum: [string, integer, decimal, boolean, date, datetime]
        value:
          type: string
          maxLength: 2048
    QueryFilter:
      type: object
      additionalProperties: false
      required: [dimension, operator]
      properties:
        dimension:
          type: string
        operator:
          type: string
          enum: [eq, ne, in, not_in, is_null, is_not_null, lt, lte, gt, gte, between]
        values:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QueryValue'
    QueryDateRange:
      type: object
      additionalProperties: false
      required: [dimension, start, end]
      description: Half-open interval [start, end); requires catalog gte and lt operators.
      properties:
        dimension:
          type: string
        start:
          $ref: '#/components/schemas/QueryValue'
        end:
          $ref: '#/components/schemas/QueryValue'
    QueryOrder:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
    QueryResult:
      type: object
      additionalProperties: false
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          maxItems: 1000
          items:
            type: array
            items: {}
    CatalogAvailability:
      type: object
      additionalProperties: false
      required: [catalog_hash, sources]
      properties:
        catalog_hash:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceAvailability'
    SourceAvailability:
      type: object
      additionalProperties: false
      required: [source_id, configured, available, unavailable, stale, tables]
      properties:
        source_id:
          type: string
        configured:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        unavailable:
          type: integer
          minimum: 0
        stale:
          type: integer
          minimum: 0
        last_scan:
          type: string
          format: date-time
        last_successful_scan:
          type: string
          format: date-time
        tables:
          type: array
          items:
            $ref: '#/components/schemas/TableAvailability'
    TableAvailability:
      type: object
      additionalProperties: false
      required: [dataset_id, schema, table, status, stale]
      properties:
        dataset_id:
          type: string
        schema:
          type: string
        table:
          type: string
        status:
          type: string
          enum: [available, unavailable]
        stale:
          type: boolean
        reason:
          type: string
          enum: [missing_table, missing_column, incompatible_type, access_denied, scan_failed, not_scanned, stale]
        inspected_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    Readiness:
      type: object
      additionalProperties: false
      required:
      - status
      - postgresql
      - dwh
      properties:
        status:
          type: string
          enum:
          - ready
          - shutting_down
          - database_unavailable
        postgresql:
          type: string
          enum:
          - available
          - unavailable
          - not_checked
        dwh:
          type: string
          enum:
          - not_configured
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code: &id001
              type: string
            message: *id001
        request_id: *id001
  responses:
    Error:
      description: Stable error; request_id matches X-Request-ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
